[project]
name = "cfde-atlas-etl"
version = "0.1.0"
description = "Prefect/Python ETL for CFDE evaluation data — sources from nih-cfde/icc-eval-core, loads Postgres for cfde-atlas."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sean Davis", email = "seandavi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.0,<4",
    "httpx>=0.27",
    "pydantic>=2,<3",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "pyrefly>=0.16",
    "pre-commit>=3.7",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.12"
